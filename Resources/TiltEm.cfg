// Tilt'Em body tilts.
//
// Preferred form - the body's north pole as a direction, the way the IAU publishes
// real obliquities. poleDec = 90 means no tilt; obliquity is 90 - poleDec.
//
//     @Properties { poleRA = 104.35   poleDec = 69.41 }
//
// Legacy form - Unity Euler degrees, used below. Still supported: it is converted to
// the equivalent pole on load, preserving both the obliquity and the prime meridian,
// so existing configs keep behaving exactly as before.
//
//
// TILT RELATIVE TO THE PARENT
//
// A tilt is normally an angle from the celestial equator. That is the wrong frame for a moon:
// a gas giant leans 23 degrees and its moons lean half a degree from ITS equator, not from the
// sky's. Writing that by hand means adding the two together as poles for every moon, and
// redoing all of them whenever you adjust the giant.
//
// Setting tiltRelativeToParent reads the tilt against the parent's equator instead:
//
//     @Body[MyMoon]
//     {
//         @Properties
//         {
//             tiltRelativeToParent = true
//             poleDec = 89.5                   // half a degree off the giant's equator
//         }
//     }
//
// With no tilt alongside it, the moon simply shares its parent's axis. Works with tiltx/tiltz
// too, and the prime meridian is left alone either way, so initialRotation goes on meaning
// what it meant.
//
// It resolves up the whole tree, so a moon under a giant that is itself written relative to
// its star comes out right. An untilted parent makes it a bit-exact no-op, so it is safe to
// set on every body in a pack. A root star has no parent: there it warns and does nothing.
//
//
// MAP CAMERA ROTATION - "SYSTEM UP"
//
// Press V in the map view or tracking station to switch the camera's up axis between:
//
//     Rotation: Pole up     the focused body's own pole, so its equator is level
//     Rotation: System up   the plane of the star it ultimately orbits
//
// Pole up frames the body you are looking at; system up frames every orbit in one shared
// plane, which is what you want when reading relative inclinations or planning a transfer.
//
// The camera eases between the two over a few frames rather than cutting, and does the same
// when you focus a body whose pole differs from the last one.
//
// System up needs to know where the system's plane is. Set it on a STAR, in either of the
// same two forms the tilts use - a pole is the NORMAL of the plane, not a direction lying
// in it:
//
//     @Body[Sun]
//     {
//         @Properties
//         {
//             orbitalPlaneRA = 273.85
//             orbitalPlaneDec = 66.99      // the ecliptic pole, in ICRF
//         }
//     }
//
// or the legacy Euler pair, orbitalPlaneX / orbitalPlaneZ.
//
// If a star has no orbital plane set, system up falls back to that star's own tilt, which
// for most systems is close enough to the invariable plane to be a sensible default. A pack
// that does not care can leave it out entirely.
//
//
// ORBITS RELATIVE TO A PARENT'S POLE
//
// KSP measures every orbit against the celestial equator. That is what you want for a
// real system - the IAU publishes real orbits that way - and a nuisance for a made-up
// one, where "in my planet's equatorial plane" is the thing you mean, and the
// celestial-frame numbers that express it are neither round nor stable if you later
// adjust the parent's pole.
//
// Setting relativeToParent in a body's Orbit node reads that body's inclination, LAN
// and argumentOfPeriapsis in its PARENT's equatorial frame instead:
//
//     @Body[MyMoon]
//     {
//         @Orbit
//         {
//             relativeToParent = true
//             inclination = 0        // exactly in MyPlanet's equatorial plane
//         }
//     }
//
// Inclination 0 then puts the moon exactly in the parent's equatorial plane whatever
// the parent's pole is doing, and any other inclination is measured from that plane.
// The longitude of the ascending node is measured in the same frame, from an inertial
// reference direction - the parent's prime meridian is deliberately not folded in, so
// the orbit does not turn with the parent's surface.
//
// It defaults to false, and a parent with no tilt makes it exactly a no-op, so it is
// safe to set on every body in a pack. The elements are converted once while the system
// is being built; everything afterwards - the saved orbit, the map view, the tracking
// station - sees ordinary celestial-frame elements.
//
//
// ELEMENT READOUTS
//
// Two places in the game show or ask for those same three orientation elements, and both
// are switched to the parent's equatorial frame to match. There is nothing to configure -
// they follow whatever tilt the parent body has.
//
//     Maneuver node editor, "Orbit (advanced)" tab
//         Inclination, LAN and argument of periapsis are shown relative to the parent's
//         equator. A craft in an equatorial orbit around a 26-degree planet now reads 0,
//         not 26. Eccentricity and the ejection angle are unchanged - neither describes
//         the plane the orbit lies in.
//
//     Debug menu (Alt+F12), Set Orbit
//         The inclination, LAN and argument of periapsis you type are read against the
//         parent's equator, so inclination 0 means equatorial around THAT body. Semi-major
//         axis, eccentricity, mean anomaly and ObT are untouched. The debug console's
//         setorbit command goes through the same conversion.
//
// The two are exact inverses of each other, so an orbit entered as inclination 0 reads
// back as inclination 0. An untilted parent leaves both bit-identical to stock, so this
// is invisible in a system with no tilts.

@Kopernicus:FOR[TiltEmExample]
{
    @Body[Sun]
    {
        @Properties
        {
            tiltx = 7.57
            tiltz = 2.12

            // The plane the map camera levels on in "system up" mode. Kerbol's own axis leans
            // 7.57 degrees above, but the stock planets orbit the celestial equator - Kerbin's
            // inclination is exactly zero - so the system plane's normal is the celestial pole.
            // Without this the camera would fall back to the star's tilt and draw Kerbin
            // inclined by that 7.57 degrees.
            orbitalPlaneRA = 0
            orbitalPlaneDec = 90
        }
    }
    @Body[Kerbin]
    {
        @Properties
        {
            tiltx = 23
            tiltz = 0
        }
    }
    @Body[Mun]
    {
        @Properties
        {
            tiltx = 15.45
            tiltz = 10.61
        }
    }
    @Body[Minmus]
    {
        @Properties
        {
            tiltx = 5.87
            tiltz = 12.63
        }
    }
    @Body[Moho]
    {
        @Properties
        {
            tiltx = 15.14
            tiltz = 30.25
        }
    }
    @Body[Eve]
    {
        @Properties
        {
            tiltx = 120.4
            tiltz = 35.82
        }
    }
    @Body[Duna]
    {
        @Properties
        {
            tiltx = 5.93
            tiltz = 3.81
        }
    }
    @Body[Ike]
    {
        @Properties
        {
            tiltx = 15.41
            tiltz = 4.22
        }
    }
    @Body[Jool]
    {
        @Properties
        {
            tiltx = 0.54
            tiltz = 1.16
        }
    }
    @Body[Laythe]
    {
        @Properties
        {
            tiltx = 10.63
            tiltz = 13.45
        }
    }
    @Body[Vall]
    {
        @Properties
        {
            tiltx = 5.5
            tiltz = 6.12
        }
    }
    @Body[Bop]
    {
        @Properties
        {
            tiltx = 7.1
            tiltz = 9.4
        }
    }
    @Body[Tylo]
    {
        @Properties
        {
            tiltx = 17.3
            tiltz = 6
        }
    }
    @Body[Gilly]
    {
        @Properties
        {
            tiltx = 15.7
            tiltz = 9.69
        }
    }
    @Body[Pol]
    {
        @Properties
        {
            tiltx = 15.4
            tiltz = 3.12
        }
    }
    @Body[Dres]
    {
        @Properties
        {
            tiltx = 8.64
            tiltz = 11.48
        }
    }
    @Body[Eeloo]
    {
        @Properties
        {
            tiltx = 80.63
            tiltz = 12.34
        }
    }
}